<!DOCTYPE html><html lang='pt-BR'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1.0'><title>Para Você ❤️</title><style>
body{margin:0;font-family:Arial;background:linear-gradient(-45deg,#ff9a9e,#fad0c4,#ffd1ff,#ffc3a0);background-size:400% 400%;animation:bg 12s infinite;display:flex;justify-content:center;align-items:center;min-height:100vh;overflow:hidden}
@keyframes bg{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
.card{max-width:900px;background:rgba(255,255,255,.2);backdrop-filter:blur(10px);padding:30px;border-radius:20px}
#msg{white-space:pre-wrap;line-height:1.8;color:#222}
button{padding:12px 24px;border:none;border-radius:30px;background:#ff4f87;color:#fff;font-size:18px;cursor:pointer}
.heart{position:fixed;top:-20px;color:#ff2d55;animation:f 8s linear forwards}
@keyframes f{to{transform:translateY(110vh) rotate(360deg);opacity:0}}
h1,#contador{text-align:center;color:#fff}
</style></head><body><div class='card'><h1>❤️ Para Você ❤️</h1><div style='text-align:center'><button id='b'>Clique aqui ❤️</button></div><div id='contador'></div><div id='msg'></div></div><script>
const carta=`Oi, meu amorrrrrrr. ❤️

Tudo bem? Bom dia, boa tarde ou boa noite, dependendo da hora que você estiver lendo isso.

Queria te dizer que eu te amo demais. Mesmo você não fazendo parte do meu dia como eu gostaria, eu continuo torcendo para que o seu dia seja bom e que você esteja bem.

Também queria te pedir mais fotos suas, igual àquela que você me enviou. Eu sempre fico olhando para ela e sinto muita saudade de você.

Esses dias até sonhei com você. Não foram sonhos muito legais, mas me fizeram perceber ainda mais o quanto você faz falta.

Eu só queria que você soubesse o quanto eu te amo e o quanto fico triste por não ter você ao meu lado. Meus amigos ficam falando várias coisas, eu tento não ligar, mas machuca.

Enfim, eu continuo te amando muito. Espero que um dia a gente passe muito tempo juntos.

Eu te amo. ❤️`;
const m=document.getElementById('msg');
document.getElementById('b').onclick=()=>{document.getElementById('b').style.display='none';let i=0;(function t(){if(i<carta.length){m.textContent+=carta[i++];setTimeout(t,18);}})();}
setInterval(()=>{let h=document.createElement('div');h.className='heart';h.textContent='❤';h.style.left=Math.random()*100+'vw';h.style.fontSize=(16+Math.random()*20)+'px';document.body.appendChild(h);setTimeout(()=>h.remove(),8000);},300);
const inicio=new Date('2026-07-08');
function c(){let d=new Date()-inicio;let dias=Math.floor(d/86400000);document.getElementById('contador').innerHTML='❤️ Juntos há '+dias+' dias ❤️';}
c();setInterval(c,60000);
</script></body></html>
